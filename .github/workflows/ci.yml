name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Data must always validate — counts (104/48/12/16), free-first ordering, no pirate links.
      - run: npm run validate:data
      - run: npm run build
