name: update-live

# Polls live scores during the tournament and commits result changes to packages/data/data/matches.json,
# which triggers a redeploy. The cron fires every 10 min, but the job self-gates: with no match in a
# live window, update-results.mjs exits immediately having made zero API calls. Outside Jun 11 – Jul 19
# every run is a fast no-op (safe to leave enabled), or disable the workflow from the Actions tab.
# (update-results.mjs and validate-data.mjs are zero-dep Node, so no npm install is needed here.)
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-live
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node packages/data/scripts/update-results.mjs
        env:
          LIVE_API_KEY: ${{ secrets.LIVE_API_KEY }}
      - run: node packages/data/scripts/validate-data.mjs
      - name: commit if changed
        run: |
          if [[ -n "$(git status --porcelain packages/data/data/matches.json)" ]]; then
            git config user.name  "kickoff26-bot"
            git config user.email "bot@users.noreply.github.com"
            git add packages/data/data/matches.json
            git commit -m "chore(data): live update $(date -u +%FT%TZ)"
            git push
          else
            echo "no changes"
          fi
